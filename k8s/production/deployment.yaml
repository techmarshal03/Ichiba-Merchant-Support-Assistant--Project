apiVersion: apps/v1
kind: Deployment
metadata:
  name: ichiba-agent
  namespace: merchant-support
  labels:
    app: ichiba-agent
    version: "1.0.0"
    team: ai-platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0           # zero-downtime rolling update
  selector:
    matchLabels:
      app: ichiba-agent
  template:
    metadata:
      labels:
        app: ichiba-agent
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ichiba-agent-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ichiba-agent
          image: ichiba.azurecr.io/ichiba-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: KEY_VAULT_URL
              value: "https://ichiba-kv.vault.azure.net/"
            - name: AZURE_OPENAI_ENDPOINT
              value: "https://ichiba-aoai-japaneast.openai.azure.com/"
            - name: AZURE_OPENAI_FALLBACK_ENDPOINT
              value: "https://ichiba-aoai-sea.openai.azure.com/"
            - name: AZURE_SEARCH_ENDPOINT
              value: "https://ichiba-search.search.windows.net"
            - name: COSMOS_ENDPOINT
              value: "https://ichiba-cosmos.documents.azure.com/"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ichiba-kv-secrets
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ichiba-agent
