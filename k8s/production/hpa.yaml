apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ichiba-agent-hpa
  namespace: merchant-support
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ichiba-agent
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    - type: External
      external:
        metric:
          name: azure_servicebus_active_messages
          selector:
            matchLabels:
              queue: merchant-queries
        target:
          type: AverageValue
          averageValue: "10"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
