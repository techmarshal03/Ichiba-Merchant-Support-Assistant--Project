apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ichiba-kv-secrets
  namespace: merchant-support
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "${WORKLOAD_IDENTITY_CLIENT_ID}"
    keyvaultName: "ichiba-kv"
    tenantId: "${AZURE_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: postgres-dsn
          objectType: secret
        - |
          objectName: redis-connection-string
          objectType: secret
        - |
          objectName: cosmos-db-key
          objectType: secret
        - |
          objectName: langsmith-api-key
          objectType: secret
        - |
          objectName: cohere-api-key
          objectType: secret
