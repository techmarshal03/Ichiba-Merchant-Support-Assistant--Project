# Local development environment
# Mounts Key Vault secrets via environment variables for dev convenience.
# Production uses Azure Workload Identity + CSI driver.

services:
  ichiba-agent:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - POSTGRES_DSN=postgresql+asyncpg://postgres:postgres@postgres:5432/ichiba
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend         # hot-reload in dev
    command: >
      uvicorn backend.main:app
        --host 0.0.0.0 --port 8080 --reload

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ichiba
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
